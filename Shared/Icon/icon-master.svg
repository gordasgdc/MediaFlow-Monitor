<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161A1E"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- undă/flow de timeline, discretă, în plan secund -->
  <path d="M 96 300 C 160 260, 200 340, 256 300 S 352 260, 416 300"
        fill="none" stroke="#2A2F35" stroke-width="10" stroke-linecap="round"/>

  <!-- semnal de puls/monitorizare, accent neon -->
  <path d="M 96 256 L 176 256 L 208 176 L 248 336 L 288 256 L 416 256"
        fill="none" stroke="url(#pulse)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <circle cx="416" cy="256" r="10" fill="#3DDC84" filter="url(#glow)"/>
</svg>
